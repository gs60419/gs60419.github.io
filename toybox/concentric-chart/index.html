<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同心圓圖表編輯器｜Toybox</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  background:
    linear-gradient(180deg, rgba(255,255,255,.90) 0 12%, rgba(255,255,255,0) 35%),
    linear-gradient(180deg, #4eb7ff 0%, #b9f3ff 52%, #48c890 100%);
  color:#2c3e50;font-size:14px;
}
.tool-topbar{
  flex-shrink:0;
  min-height:58px;
  padding:10px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  color:#fff;
  background:
    linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.08)),
    linear-gradient(90deg, rgba(0,117,206,.90), rgba(0,188,214,.78), rgba(91,190,86,.70));
  border-bottom:1px solid rgba(255,255,255,.58);
  box-shadow:0 10px 24px rgba(0,79,135,.20);
  backdrop-filter:blur(18px) saturate(1.35);
}
.tool-brand,.tool-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tool-brand{font-weight:800}
.tool-mark{
  width:22px;height:22px;border:2px solid #f0f6fc;
  background:
    linear-gradient(#fff06d,#fff06d) 7px 0 / 8px 22px no-repeat,
    linear-gradient(#2f9dff,#2f9dff) 0 7px / 22px 8px no-repeat;
}
.tool-nav a{
  min-height:34px;
  padding:7px 12px;
  border:1px solid rgba(255,255,255,.64);
  border-radius:8px;
  color:#fff;
  text-decoration:none;
  font-weight:700;
  background:linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,.12)), rgba(0,77,145,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72), 0 6px 18px rgba(0,64,120,.16);
}
#tool-shell{
  flex:1;
  min-height:0;
  display:flex;
  overflow:hidden;
}

/* ── Left panel ── */
#chart-panel{
  width:500px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#fff;padding:20px;
  border-right:1px solid #dde1e7;
  box-shadow:2px 0 10px rgba(0,0,0,.06);
}
#chart-svg{
  width:460px;height:460px;
  border-radius:16px;
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.10));
}
.chart-toolbar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.btn{
  padding:7px 16px;border-radius:7px;cursor:pointer;font-size:13px;
  font-family:inherit;border:none;transition:all .15s;
}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-ghost{background:#f3f4f6;color:#555;border:1px solid #e5e7eb}
.btn-ghost:hover{background:#e9ebef}
.btn-danger{background:#fff0f0;color:#ef4444;border:1px solid #fca5a5}
.btn-danger:hover{background:#fef2f2}

/* ── Right panel ── */
#ctrl-panel{
  flex:1;overflow-y:auto;padding:22px 24px;
  background:#f7f8fa;
}
#ctrl-panel::-webkit-scrollbar{width:5px}
#ctrl-panel::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}

.panel-title{
  font-size:16px;font-weight:700;color:#111827;
  margin-bottom:18px;display:flex;align-items:center;gap:8px;
}
.section-label{
  font-size:11px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:#9ca3af;
  margin:16px 0 8px;
}

/* ── Ring tabs ── */
.ring-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.tab{
  padding:5px 13px;border:1.5px solid #d1d5db;border-radius:20px;
  cursor:pointer;font-size:12px;background:#fff;color:#555;
  transition:all .15s;font-family:inherit;
}
.tab:hover{border-color:#93c5fd;color:#2563eb}
.tab.active{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}
.tab-add{
  padding:5px 12px;border:1.5px dashed #d1d5db;border-radius:20px;
  cursor:pointer;font-size:12px;background:transparent;color:#9ca3af;
  transition:all .15s;font-family:inherit;
}
.tab-add:hover{border-color:#60a5fa;color:#3b82f6}

/* ── Ring name row ── */
.ring-name-row{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.ring-name-input{
  flex:1;padding:6px 10px;border:1px solid #e5e7eb;border-radius:6px;
  font-size:14px;font-family:inherit;background:#fafafa;color:#1f2937;
}
.ring-name-input:focus{outline:none;border-color:#93c5fd;background:#fff}

/* ── Segment cards ── */
.seg-list{display:flex;flex-direction:column;gap:7px}
.seg-card{
  background:#fff;border:1px solid #e5e7eb;border-radius:9px;
  padding:10px 12px;transition:box-shadow .15s;
}
.seg-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:#c7d2fe}
.seg-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.seg-num{font-size:11px;color:#9ca3af;width:14px;text-align:center;flex-shrink:0}
.seg-color{
  width:30px;height:30px;border-radius:7px;border:2px solid #e5e7eb;
  cursor:pointer;flex-shrink:0;padding:0;overflow:hidden;background:none;
}
.seg-color::-webkit-color-swatch-wrapper{padding:0}
.seg-color::-webkit-color-swatch{border:none;border-radius:4px}
.seg-text{
  flex:1;padding:5px 9px;border:1px solid #e5e7eb;border-radius:6px;
  font-size:14px;font-family:inherit;color:#1f2937;
}
.seg-text:focus{outline:none;border-color:#93c5fd}
.seg-del{
  background:none;border:none;color:#d1d5db;cursor:pointer;
  font-size:16px;padding:2px 5px;line-height:1;flex-shrink:0;
  border-radius:4px;transition:all .1s;
}
.seg-del:hover{color:#ef4444;background:#fff0f0}
.seg-hex{
  width:74px;flex-shrink:0;
  padding:5px 7px;border:1px solid #e5e7eb;border-radius:6px;
  font-size:12px;font-family:'Menlo','Consolas',monospace;
  color:#374151;letter-spacing:.5px;text-transform:uppercase;
  transition:border-color .15s,color .15s;
}
.seg-hex:focus{outline:none;border-color:#93c5fd}
.seg-fsinput{
  width:58px;padding:4px 7px;border:1px solid #e5e7eb;border-radius:6px;
  font-size:13px;font-family:inherit;color:#1f2937;text-align:center;
  -moz-appearance:textfield;
}
.seg-fsinput::-webkit-inner-spin-button,.seg-fsinput::-webkit-outer-spin-button{-webkit-appearance:none}
.seg-fsinput:focus{outline:none;border-color:#93c5fd}
.seg-fsinput::placeholder{color:#c0c4cc;font-size:11px}
.seg-weight{display:flex;align-items:center;gap:8px;font-size:12px;color:#6b7280}
.seg-weight-label{width:24px;flex-shrink:0;color:#9ca3af}
.seg-weight-slider{flex:1;accent-color:#3b82f6;cursor:pointer}
.seg-weight-val{width:32px;text-align:right;font-size:12px;font-weight:600;color:#374151}
.seg-weight-numbox{
  width:52px;padding:4px 6px;border:1px solid #e5e7eb;border-radius:6px;
  font-size:12px;font-family:inherit;font-weight:600;color:#1f2937;text-align:center;
  flex-shrink:0;-moz-appearance:textfield;
}
.seg-weight-numbox::-webkit-inner-spin-button,.seg-weight-numbox::-webkit-outer-spin-button{-webkit-appearance:none}
.seg-weight-numbox:focus{outline:none;border-color:#93c5fd}

.tc-auto-btn{
  padding:3px 8px;border:1px solid #e5e7eb;border-radius:5px;
  cursor:pointer;font-size:11px;font-family:inherit;color:#9ca3af;
  background:#fff;transition:all .15s;flex-shrink:0;
}
.tc-auto-btn:hover{border-color:#93c5fd;color:#3b82f6}
.tc-auto-btn.active{background:#dbeafe;border-color:#93c5fd;color:#2563eb;font-weight:600}
.add-seg-btn{
  display:flex;align-items:center;justify-content:center;gap:4px;
  width:100%;padding:8px;margin-top:6px;
  background:#f0f7ff;border:1.5px dashed #bfdbfe;border-radius:8px;
  cursor:pointer;color:#3b82f6;font-size:13px;font-family:inherit;
  transition:all .15s;
}
.add-seg-btn:hover{background:#dbeafe;border-color:#93c5fd}

/* ── Global settings ── */
.settings-box{
  background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:12px 14px;
}
.setting-row{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:#4b5563;margin-bottom:9px;
}
.setting-row:last-child{margin-bottom:0}
.setting-label{width:68px;flex-shrink:0;font-size:12px}
.setting-slider{flex:1;accent-color:#3b82f6;cursor:pointer}
.setting-val{width:38px;text-align:right;font-weight:600;color:#1f2937;font-size:12px}

/* ── Connection cards ── */
.conn-card{
  background:#fff;border:1px solid #e5e7eb;border-radius:9px;
  padding:10px 12px;margin-bottom:8px;
}
.conn-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.conn-opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px;padding:6px 8px;background:#f9fafb;border-radius:6px}
.conn-opt-label{display:flex;align-items:center;gap:4px;font-size:12px;color:#4b5563;cursor:pointer;white-space:nowrap}
.conn-pt-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.conn-select{
  flex:1;padding:4px 6px;border:1px solid #e5e7eb;border-radius:5px;
  font-size:12px;font-family:inherit;color:#1f2937;background:#fff;cursor:pointer;
}
.conn-select:focus{outline:none;border-color:#93c5fd}
/* ── Divider ── */
.divider{height:1px;background:#e5e7eb;margin:16px 0}
@media (max-width: 860px){
  body{height:auto;min-height:100vh;overflow:auto}
  .tool-topbar{align-items:flex-start;flex-direction:column}
  #tool-shell{display:block;overflow:visible}
  #chart-panel{width:100%;min-height:auto;border-right:0;border-bottom:1px solid #dde1e7}
  #chart-svg{width:min(92vw,460px);height:min(92vw,460px)}
  #ctrl-panel{overflow:visible}
}
</style>
</head>
<body>
<header class="tool-topbar">
  <div class="tool-brand">
    <span class="tool-mark" aria-hidden="true"></span>
    <span>Goofy Toymaker / Toybox</span>
  </div>
  <nav class="tool-nav" aria-label="Tool navigation">
    <a href="../index.html">Toybox 總覽</a>
    <a href="../../xiaopi/index.html">小屁論</a>
    <a href="../../index.html">首頁</a>
  </nav>
</header>

<div id="tool-shell">
<!-- ══ Chart Panel ══ -->
<div id="chart-panel">
  <svg id="chart-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="chart-toolbar">
    <button class="btn btn-primary" onclick="exportSVG()">⬇ 匯出 SVG</button>
    <button class="btn btn-ghost" onclick="exportPNG()">⬇ 匯出 PNG</button>
    <button class="btn btn-ghost" onclick="importSVG()">⬆ 匯入 SVG</button>
    <button class="btn btn-ghost" onclick="resetDefault()">↺ 還原預設</button>
  </div>
</div>

<!-- ══ Controls Panel ══ -->
<div id="ctrl-panel">
  <div class="panel-title">◎ 同心圓圖表編輯器</div>

  <div class="section-label">環選擇</div>
  <div id="tabs-wrap"></div>

  <div id="ring-editor"></div>

  <div class="divider"></div>
  <div class="section-label">全域設定</div>
  <div class="settings-box" id="global-settings"></div>

  <div class="divider"></div>
  <div class="section-label">連線群組</div>
  <div id="conn-section"></div>
  <button class="add-seg-btn" style="margin-top:4px" onclick="addConnGroup()">＋ 新增連線群組</button>
</div>
</div>

<script>
// ════════════════════════════════════════════════════
//  Constants
// ════════════════════════════════════════════════════
const SVG_NS = 'http://www.w3.org/2000/svg';
const CX = 250, CY = 250, R_MAX = 232;

// ════════════════════════════════════════════════════
//  Default data  (matches the reference image)
// ════════════════════════════════════════════════════
const DEFAULT = {
  gap: 6,
  startAngle: 0,
  bgColor: '#ffffff',
  activeRing: 0,
  connections: [
    {
      id: 1,
      name: '發散三角',
      color: '#ffa200',
      width: 5,
      opacity: 1,
      close: true,
      dash: false,
      fillOpacity: 0,
      points: [
        { ri: 3, si: 0 },
        { ri: 3, si: 2 },
        { ri: 3, si: 4 }
      ]
    },
    {
      id: 2,
      name: '收斂三角',
      color: '#02b3c0',
      width: 5,
      opacity: 1,
      close: true,
      dash: false,
      fillOpacity: 0,
      points: [
        { ri: 3, si: 1 },
        { ri: 3, si: 3 },
        { ri: 3, si: 5 }
      ]
    }
  ],
  rings: [
    {
      name: '中心',
      segments: [
        { label: '差異', color: '#dbdbdb', weight: 1, fontSize: 30, textColor: '' }
      ]
    },
    {
      name: '環 1',
      segments: [
        { label: '發散', color: '#bd0000', weight: 1, fontSize: 22 },
        { label: '收斂', color: '#2e74ff', weight: 1, fontSize: 22 }
      ]
    },
    {
      name: '環 2',
      segments: [
        { label: '分化', color: '#bd0000', weight: 1, textColor: '', fontSize: 22 },
        { label: '存在', color: '#00d64f', weight: 1, fontSize: 22 },
        { label: '語法', color: '#2e74ff', weight: 1, fontSize: 22 }
      ]
    },
    {
      name: '環 3',
      segments: [
        { label: 'Δ生理', color: '#e00000', weight: 1 },
        { label: 'π生存', color: '#70ffff', weight: 1 },
        { label: 'ψ意義', color: '#00d64f', weight: 1 },
        { label: 'φ敘事', color: '#fe95eb', weight: 1 },
        { label: 'η社會', color: '#004eeb', weight: 1 },
        { label: 'Ω認知', color: '#ffe77a', weight: 1 }
      ]
    }
  ]
};

// ════════════════════════════════════════════════════
//  State
// ════════════════════════════════════════════════════
let S = JSON.parse(JSON.stringify(DEFAULT));
let _connId = DEFAULT.connections.length;

// ════════════════════════════════════════════════════
//  Math helpers
// ════════════════════════════════════════════════════
function toRad(deg){ return deg * Math.PI / 180; }

// polar→cartesian; angle 0 = top (12 o'clock), increases clockwise
function polar(r, deg){
  const rad = toRad(deg - 90);
  return { x: CX + r * Math.cos(rad), y: CY + r * Math.sin(rad) };
}

function getRingBounds(ri){
  const n = S.rings.length;
  const totalGap = S.gap * (n - 1);
  const rw = (R_MAX - totalGap) / n;
  const inner = ri * (rw + S.gap);
  const outer = inner + rw;
  return { inner, outer, rw };
}

// Build SVG path for an annulus sector (or full circle / pie slice)
function sectorPath(inner, outer, a1, a2){
  const delta = a2 - a1;

  // Full circle (single-segment ring)
  if(Math.abs(delta) >= 359.99){
    if(inner < 0.5){
      // Solid circle
      return `M${CX-outer},${CY} a${outer},${outer} 0 1,1 ${outer*2},0 a${outer},${outer} 0 1,1 ${-outer*2},0 Z`;
    }
    // Annulus
    return `M${CX-outer},${CY} a${outer},${outer} 0 1,1 ${outer*2},0 a${outer},${outer} 0 1,1 ${-outer*2},0 Z`
         + `M${CX-inner},${CY} a${inner},${inner} 0 1,0 ${inner*2},0 a${inner},${inner} 0 1,0 ${-inner*2},0 Z`;
  }

  const large = delta > 180 ? 1 : 0;
  const o1 = polar(outer, a1), o2 = polar(outer, a2);
  const i2 = polar(inner, a2), i1 = polar(inner, a1);

  if(inner < 0.5){
    // Pie slice
    return `M${CX},${CY} L${o1.x},${o1.y} A${outer},${outer} 0 ${large},1 ${o2.x},${o2.y} Z`;
  }
  // Annulus sector
  return `M${o1.x},${o1.y} A${outer},${outer} 0 ${large},1 ${o2.x},${o2.y}`
       + ` L${i2.x},${i2.y} A${inner},${inner} 0 ${large},0 ${i1.x},${i1.y} Z`;
}

// Choose readable text color based on background
function textColor(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 155 ? '#222' : '#fff';
}

// ════════════════════════════════════════════════════
//  Chart rendering  (3-pass: fills → connections → text)
// ════════════════════════════════════════════════════
function renderChart(){
  const svg = document.getElementById('chart-svg');
  svg.innerHTML = '';

  // Background
  const bg = document.createElementNS(SVG_NS,'rect');
  bg.setAttribute('width',500); bg.setAttribute('height',500);
  bg.setAttribute('fill', S.bgColor || '#ffffff'); bg.setAttribute('rx','16');
  svg.appendChild(bg);

  // Apply halo stroke so text stays readable over connection lines
  function applyHalo(t, bgColor){
    t.setAttribute('stroke', bgColor);
    t.setAttribute('stroke-width', '5');
    t.setAttribute('stroke-linejoin', 'round');
    t.setAttribute('paint-order', 'stroke fill');
  }

  // Helper: append a text element for a segment
  function appendSegText(svg, seg, ri, rw, inner, outer, a1, sweep){
    if(!seg.label || !seg.label.trim() || sweep <= 8) return;
    const midAngle = a1 + sweep / 2;
    const midR = (ri === 0 && S.rings[ri].segments.length === 1) ? 0
               : ri === 0 ? outer * 0.5
               : (inner + outer) / 2;
    const pos = polar(midR, midAngle);
    const arcLen = (sweep / 360) * 2 * Math.PI * (midR || 1);
    const chars = seg.label.length || 1;
    const isNarrow = !seg.fontSize && sweep < 50 && chars >= 2;

    if(isNarrow){
      const ch = Math.min(rw * 0.28, 15);
      const totalH = ch * chars;
      const col = seg.textColor || textColor(seg.color);
      [...seg.label].forEach((c, i) => {
        const t = document.createElementNS(SVG_NS,'text');
        t.setAttribute('x', pos.x);
        t.setAttribute('y', pos.y - totalH/2 + ch/2 + i*ch);
        t.setAttribute('text-anchor','middle');
        t.setAttribute('dominant-baseline','central');
        t.setAttribute('fill', col);
        t.setAttribute('font-size', (ch*0.85).toFixed(1));
        t.setAttribute('font-weight','700');
        t.setAttribute('font-family','-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif');
        t.setAttribute('pointer-events','none');
        applyHalo(t, seg.color);
        t.textContent = c;
        svg.appendChild(t);
      });
    } else {
      const autoFs = Math.max(Math.min(rw * 0.32, arcLen / chars * 0.6, 20), 9);
      const fs = seg.fontSize ? seg.fontSize : autoFs;
      const t = document.createElementNS(SVG_NS,'text');
      t.setAttribute('x', pos.x);
      t.setAttribute('y', pos.y);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('dominant-baseline','central');
      t.setAttribute('fill', seg.textColor || textColor(seg.color));
      t.setAttribute('font-size', fs.toFixed(1));
      t.setAttribute('font-weight','700');
      t.setAttribute('font-family','-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif');
      t.setAttribute('pointer-events','none');
      applyHalo(t, seg.color);
      t.textContent = seg.label;
      svg.appendChild(t);
    }
  }

  // ── Pass 1: fills only ──
  S.rings.forEach((ring, ri) => {
    const { inner, outer, rw } = getRingBounds(ri);
    const totalW = ring.segments.reduce((s,x) => s + x.weight, 0);
    let angle = S.startAngle;
    ring.segments.forEach(seg => {
      const sweep = (seg.weight / totalW) * 360;
      const a1 = angle, a2 = angle + sweep;
      angle = a2;
      const pathEl = document.createElementNS(SVG_NS,'path');
      pathEl.setAttribute('d', sectorPath(ri === 0 ? 0 : inner, outer, a1, a2));
      pathEl.setAttribute('fill', seg.color);
      pathEl.setAttribute('stroke', '#fff');
      pathEl.setAttribute('stroke-width', '2');
      pathEl.setAttribute('stroke-linejoin','round');
      svg.appendChild(pathEl);
    });
  });

  // ── Pass 2: connections ──
  drawConnections(svg);

  // ── Pass 3: text on top of everything ──
  S.rings.forEach((ring, ri) => {
    const { inner, outer, rw } = getRingBounds(ri);
    const totalW = ring.segments.reduce((s,x) => s + x.weight, 0);
    let angle = S.startAngle;
    ring.segments.forEach(seg => {
      const sweep = (seg.weight / totalW) * 360;
      const a1 = angle;
      angle += sweep;
      appendSegText(svg, seg, ri, rw, inner, outer, a1, sweep);
    });
  });
}

// Compute the center (x,y) of a segment
function segCenter(ri, si){
  if(ri >= S.rings.length) return null;
  const ring = S.rings[ri];
  if(si >= ring.segments.length) return null;
  const { inner, outer } = getRingBounds(ri);
  const totalW = ring.segments.reduce((s,x) => s + x.weight, 0);
  let angle = S.startAngle;
  for(let i = 0; i < si; i++) angle += (ring.segments[i].weight / totalW) * 360;
  const sweep = (ring.segments[si].weight / totalW) * 360;
  const midAngle = angle + sweep / 2;
  const midR = (ri === 0 && ring.segments.length === 1) ? 0
             : ri === 0 ? outer * 0.5
             : (inner + outer) / 2;
  return polar(midR, midAngle);
}

function drawConnections(svg){
  if(!S.connections || !S.connections.length) return;
  S.connections.forEach(conn => {
    const pts = conn.points
      .map(p => segCenter(p.ri, p.si))
      .filter(Boolean);
    if(pts.length < 2) return;

    const closed = conn.close && pts.length >= 3;
    const ptStr = pts.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');

    // Fill polygon
    if(closed && conn.fillOpacity > 0){
      const poly = document.createElementNS(SVG_NS, 'polygon');
      poly.setAttribute('points', ptStr);
      poly.setAttribute('fill', conn.color);
      poly.setAttribute('fill-opacity', conn.fillOpacity);
      poly.setAttribute('stroke', 'none');
      svg.appendChild(poly);
    }

    // Stroke lines
    const el = document.createElementNS(SVG_NS, closed ? 'polygon' : 'polyline');
    el.setAttribute('points', ptStr);
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', conn.color);
    el.setAttribute('stroke-width', conn.width);
    el.setAttribute('stroke-linejoin', 'round');
    el.setAttribute('stroke-linecap', 'round');
    el.setAttribute('stroke-dasharray', conn.dash ? '6 4' : 'none');
    el.setAttribute('opacity', conn.opacity);
    svg.appendChild(el);

    // Dots at each node
    pts.forEach(p => {
      const c = document.createElementNS(SVG_NS, 'circle');
      c.setAttribute('cx', p.x.toFixed(2));
      c.setAttribute('cy', p.y.toFixed(2));
      c.setAttribute('r', conn.width + 2);
      c.setAttribute('fill', conn.color);
      c.setAttribute('opacity', conn.opacity);
      svg.appendChild(c);
    });
  });
}

const PALETTE = ['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];

function addSegment(ri){
  const n = S.rings[ri].segments.length;
  S.rings[ri].segments.push({ label:'', color: PALETTE[n % PALETTE.length], weight: 1 });
  renderControls();
  renderChart();
}

function addRing(){
  const n = S.rings.length;
  S.rings.push({
    name: `環 ${n}`,
    segments: [
      { label:'', color: PALETTE[0], weight: 1 },
      { label:'', color: PALETTE[1], weight: 1 }
    ]
  });
  S.activeRing = S.rings.length - 1;
  renderControls();
  renderChart();
}

function deleteRing(ri){
  if(S.rings.length <= 1) return;
  S.rings.splice(ri, 1);
  S.activeRing = Math.min(S.activeRing, S.rings.length - 1);
  renderControls();
  renderChart();
}

function resetDefault(){
  S = JSON.parse(JSON.stringify(DEFAULT));
  _connId = DEFAULT.connections.length;
  renderControls();
  renderChart();
}

function exportSVG(){
  const svg = document.getElementById('chart-svg');
  // Embed editor state so the SVG can be re-imported later
  let desc = svg.querySelector('desc#editor-state');
  if(!desc){ desc = document.createElementNS(SVG_NS,'desc'); desc.id='editor-state'; svg.insertBefore(desc, svg.firstChild); }
  desc.textContent = JSON.stringify({ gap: S.gap, startAngle: S.startAngle, bgColor: S.bgColor, rings: S.rings, connections: S.connections });
  const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type:'image/svg+xml' });
  desc.remove();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'concentric-chart.svg';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importSVG(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.svg,image/svg+xml';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const doc = new DOMParser().parseFromString(ev.target.result, 'image/svg+xml');
        const desc = doc.querySelector('desc#editor-state');
        if(!desc) { alert('此 SVG 沒有包含編輯器資料。\n請匯入由本工具所匯出的 SVG 檔案。'); return; }
        const data = JSON.parse(desc.textContent);
        if(!data.rings) throw new Error('格式錯誤');
        S.gap = data.gap ?? 5;
        S.startAngle = data.startAngle ?? -90;
        S.bgColor = data.bgColor ?? '#ffffff';
        S.rings = data.rings;
        S.connections = data.connections ?? [];
        S.activeRing = 0;
        renderControls();
        renderChart();
      } catch(err) {
        alert('匯入失敗：無法解析資料。\n' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function exportPNG(){
  const svg = document.getElementById('chart-svg');
  const data = new XMLSerializer().serializeToString(svg);
  const scale = 2;
  const W = 500 * scale, H = 500 * scale;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  // Fill background if not transparent
  if(S.bgColor && S.bgColor !== 'transparent'){
    ctx.fillStyle = S.bgColor;
    ctx.fillRect(0, 0, W, H);
  }
  const blob = new Blob([data], { type:'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'concentric-chart.png';
    a.click();
  };
  img.src = url;
}

// ════════════════════════════════════════════════════
//  Init
// ════════════════════════════════════════════════════
renderControls();
renderChart();
</script>
